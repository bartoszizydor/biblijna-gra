<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitwa Dawida</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: linear-gradient(#bfe6ff, #fdf6e3 45%);
         font-family: "Comic Sans MS", "Trebuchet MS", sans-serif; color: #3b2f1e; }
  [hidden] { display: none !important; }
  /* szerokość liczona z wysokości ekranu, żeby całe pole + karty mieściły się w pionie */
  #game { --reserve: 250px; width: max(220px, min(360px, 100vw - 24px, (100vh - var(--reserve)) * 0.69)); text-align: center; padding: 6px 0; }
  @supports (height: 100dvh) { #game { width: max(220px, min(360px, 100vw - 24px, (100dvh - var(--reserve)) * 0.69)); } }
  #game.duo { --reserve: 320px; } /* we dwoje: druga ręka kart u góry */
  .flip { transform: rotate(180deg); } /* gracz 2 siedzi naprzeciwko */
  .emo { padding: 0 3px !important; font-size: 15px !important; border-width: 2px; }
  .camp { display: grid; gap: 6px; }
  .camp button, #duo { font-size: 16px; padding: 8px; text-align: left; }
  #duo { width: 100%; text-align: center; margin-top: 8px; }
  .quests div { display: flex; justify-content: space-between; gap: 8px; text-align: left; padding: 3px 0; }
  .badges { display: flex; justify-content: center; gap: 8px; font-size: 28px; }
  .badges .off { filter: grayscale(1); opacity: .3; }
  #menu { width: min(480px, 100vw - 24px); text-align: center; padding: 12px 0 24px; }
  h1 { font-size: 26px; margin: 0 0 8px; color: #8b5a2b; text-shadow: 0 2px 0 #fff; }
  .panel { background: #fffaf0; border: 3px solid #e0b84f; border-radius: 16px; padding: 10px; margin-bottom: 12px; }
  .label { font-weight: bold; margin: 12px 0 8px; }
  #menuMsg { color: #8e2b1f; min-height: 1.2em; margin: 6px 0; }
  .diffs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .diffs button { font-size: 17px; padding: 10px 4px; }
  canvas { width: 100%; border-radius: 18px; border: 6px solid #8b5a2b; box-shadow: 0 6px 0 #5b3a1a;
           touch-action: none; display: block; box-sizing: border-box; }
  #topRow, #manaRow, #manaRow2 { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: bold; }
  #topRow { margin: 0 0 6px; }
  #manaRow, #manaRow2 { margin: 8px 0 10px; font-size: 16px; }
  #clock { min-width: 4.2em; } #clock.x2 { color: #8e44ad; }
  .bar { flex: 1; height: 14px; border-radius: 8px; background: #5b3a1a; border: 3px solid #e0b84f; overflow: hidden; position: relative; }
  #fill, #foeFill, #fill2 { height: 100%; width: 0; }
  #fill { background: linear-gradient(#e2b6ff, #8e44ad); }
  #foeFill, #fill2 { background: linear-gradient(#ff9a8a, #c0392b); }
  .bar::after { content: ""; position: absolute; inset: 0;
                background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), rgba(0,0,0,.35) calc(10% - 2px) 10%); }
  button { font: inherit; font-size: 13px; padding: 4px 2px; border: 3px solid #e0b84f; border-radius: 14px;
           background: linear-gradient(#fffdf5, #f3e3b5); color: inherit; cursor: pointer; box-shadow: 0 4px 0 #c49a3a; }
  button.icon { padding: 0 6px; font-size: 16px; box-shadow: none; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 6px; }
  .hand { grid-template-columns: repeat(4, 1fr) .75fr; align-items: end; }
  .cards button { position: relative; transition: transform .1s, filter .2s; }
  .cards .e { display: block; font-size: 24px; }
  .cards small { display: block; font-size: 11px; opacity: .8; }
  .cards button.sel { transform: translateY(-3px); border-color: #c48a00; box-shadow: 0 7px 0 #c48a00, 0 0 0 3px #ffd84d; }
  .cards button.poor { filter: grayscale(.8); opacity: .6; }
  .cards button.indeck { border-color: #27ae60; background: linear-gradient(#f0fff0, #c8f2c8); box-shadow: 0 4px 0 #1e8449; }
  .cards button.locked { opacity: .45; cursor: default; }
  .power { background: linear-gradient(#fffbe0, #ffe98a); }
  #next { font-size: 11px; opacity: .75; border: 2px dashed #c49a3a; border-radius: 12px; padding: 2px 0; }
  .cost { position: absolute; top: -8px; right: -6px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
          background: #8e44ad; color: #fff; border: 2px solid #fff; font-size: 13px; font-weight: bold; }
  #askRow { display: flex; gap: 6px; margin-top: 10px; }
  #hero { font-size: 15px; padding: 6px; background: linear-gradient(#fff3e0, #ffb74d); }
  .shop { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .shop button { font-size: 14px; padding: 6px 2px; }
  .track { height: 12px; border-radius: 6px; background: #e8d8b0; overflow: hidden; margin: 6px 0; }
  .track div { height: 100%; background: linear-gradient(90deg, #f1c40f, #e67e22); }
  #ask { flex: 1; font-size: 16px; padding: 6px; background: linear-gradient(#fff6d5, #f7d774); }
  #ask:disabled { opacity: .55; cursor: default; }
  dialog { border: 4px solid #e0b84f; border-radius: 20px; max-width: 420px; text-align: center; background: #fffaf0; color: inherit; }
  dialog[open] { animation: pop .25s ease-out; }
  dialog::backdrop { background: rgba(40, 25, 10, .45); }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } }
  dialog p { font-size: 19px; }
  dialog button { display: block; width: 100%; margin: 10px 0; font-size: 20px; padding: 12px; }
  @media (prefers-reduced-motion: reduce) { dialog[open] { animation: none; } .cards button { transition: none; } }
</style>
</head>
<body>
<section id="menu">
  <h1>⛺ Bitwa Dawida 🏯</h1>
  <div class="panel" id="arena"></div>
  <p class="label">Wybierz poziom i walcz:</p>
  <div class="diffs" id="diffs"></div>
  <button id="duo">👫 Zagraj we dwoje na jednym ekranie</button>
  <p class="label">🎪 Tryby specjalne</p>
  <div class="diffs" id="modes" style="grid-template-columns:repeat(2,1fr)"></div>
  <p id="menuMsg"></p>
  <p class="label">📜 Kampania: historie z Biblii</p>
  <div class="camp" id="camp"></div>
  <p class="label">🎯 Zadania dnia (nagroda: skrzynia)</p>
  <div class="panel quests" id="quests"></div>
  <p class="label">🏅 Odznaki</p>
  <div class="panel badges" id="badges"></div>
  <p class="label">🛤️ Ścieżka pielgrzyma (w tym miesiącu)</p>
  <div class="panel" id="season"></div>
  <p class="label">🛒 Sklep dnia</p>
  <div class="panel" id="shopBox"></div>
  <p class="label">📊 Statystyki</p>
  <div class="panel" id="statsBox"></div>
  <p class="label">Twoja talia (<span id="deckCount">8</span>/8): dotknij karty, aby ją dodać lub zabrać</p>
  <div class="cards" id="coll"></div>
  <p><button id="sound" style="padding:8px 14px;font-size:15px">🔊 Dźwięk: włączony</button></p>
</section>

<main id="game" hidden>
  <div id="p2" class="flip" hidden>
    <div id="manaRow2"><span id="manaText2">🍞 0</span>
      <div class="bar" role="progressbar" aria-label="Manna gracza 2"><div id="fill2"></div></div>
      <button class="icon emo" data-s="1">🙏</button><button class="icon emo" data-s="1">😄</button><button class="icon emo" data-s="1">👏</button></div>
    <div class="cards hand" id="hand2"><div id="next2"></div></div>
  </div>
  <div id="topRow">
    <span id="foeText">🏯 0</span>
    <div class="bar" role="progressbar" aria-label="Manna przeciwnika" aria-valuemin="0" aria-valuemax="10"><div id="foeFill"></div></div>
    <span id="clock">3:00</span><span id="crowns">👑 0:0</span>
    <button id="mute" class="icon" aria-label="Włącz lub wyłącz dźwięk">🔊</button>
  </div>
  <canvas id="c" aria-label="Pole bitwy. Wybierz kartę i dotknij pola."></canvas>
  <div id="manaRow"><span id="manaText">🍞 0</span>
    <div class="bar" role="progressbar" aria-label="Manna" aria-valuemin="0" aria-valuemax="10"><div id="fill"></div></div>
    <button class="icon emo" data-s="0" aria-label="Emotka modlitwa">🙏</button><button class="icon emo" data-s="0" aria-label="Emotka uśmiech">😄</button><button class="icon emo" data-s="0" aria-label="Emotka brawo">👏</button></div>
  <div class="cards hand" id="hand"><div id="next"></div></div>
  <div id="askRow"><button id="ask">📖 Zagadka = +3 🍞</button><button id="hero" hidden></button></div>
</main>
<dialog id="dlg"></dialog>
<script>
const W = 360, H = 520, MAX_MANA = 10, MANA_PER_SEC = 0.5, TIME = 180, OVERTIME = 60;
const BRIDGES = [W / 4, W * 3 / 4]; // przez rzekę można przejść tylko po mostach

// postacie, które nie są kartami: zwierzęta z arki i olbrzym z kampanii
const ANIMAL = { name: "Zwierzęta", me: "🐑", foe: "🐀", hp: 28, dmg: 6, range: 20, speed: 55 };
const LIONS = { name: "Lwy", me: "🦁", foe: "🦁", hp: 55, dmg: 9, range: 20, speed: 60, count: 2 };
const GOLIAT = { name: "Goliat", me: "🧌", foe: "🧌", hp: 420, dmg: 28, range: 20, speed: 22, big: true };
// me = Twoja postać, foe = postać przeciwnika o tych samych siłach; type "power" = Boża moc, "building" = budowla
const CARDS = [
  { id: "trebacz", name: "Trębacz", me: "🎺", foe: "🐎", cost: 2, hp: 30,  dmg: 6,  range: 20,  speed: 70, arena: 0, info: "Bardzo szybki" },
  { id: "dawid",   name: "Dawid",   me: "👦", foe: "🏹", cost: 3, hp: 45,  dmg: 9,  range: 100, speed: 40, arena: 0, info: "Proca z daleka, trafia też latających" },
  { id: "gedeon",  name: "Gedeon",  me: "🏺", foe: "🐫", cost: 3, hp: 22,  dmg: 5,  range: 20,  speed: 60, arena: 0, count: 3, info: "3 wojowników naraz" },
  { id: "lew",     name: "Lew",     me: "🦁", foe: "🐺", cost: 4, hp: 90,  dmg: 15, range: 20,  speed: 55, arena: 0, info: "Silny i szybki" },
  { id: "eliasz",  name: "Eliasz",  me: "🔥", foe: "🐍", cost: 4, hp: 50,  dmg: 14, range: 110, speed: 35, arena: 0, info: "Ogień z nieba z daleka" },
  { id: "jozue",   name: "Jozue",   me: "⚔️", foe: "🐗", cost: 4, hp: 110, dmg: 10, range: 20,  speed: 45, arena: 0, siege: true, onlyBuildings: true, info: "Idzie tylko na wieże i mury, bije ×3" },
  { id: "samson",  name: "Samson",  me: "💪", foe: "🛡️", cost: 5, hp: 180, dmg: 20, range: 20,  speed: 28, arena: 0, splash: 40, info: "Bije kilku wrogów naraz" },
  { id: "grad",    name: "Grad",    me: "⛈️", type: "power", cost: 4, dmg: 60, radius: 50, arena: 0, info: "Boża moc: grad rani wrogów w kółku" },
  { id: "blogo",   name: "Błogosł.", me: "🙏", type: "power", cost: 2, heal: 70, radius: 60, arena: 0, info: "Boża moc: błogosławieństwo leczy Twoich" },
  { id: "golebica", name: "Gołębica", me: "🕊️", foe: "🦇", cost: 2, hp: 35, dmg: 7, range: 20, speed: 75, air: true, arena: 1, info: "Lata nad rzeką" },
  { id: "mur",     name: "Mur",     me: "🧱", foe: "🪵", type: "building", cost: 3, hp: 320, arena: 1, info: "Mur Nehemiasza: zatrzymuje wrogów" },
  { id: "traby",   name: "Trąby",   me: "📯", type: "power", cost: 3, towerDmg: 110, radius: 45, arena: 1, info: "Boża moc: trąby Jerycha kruszą tylko wieże" },
  { id: "mojzesz", name: "Mojżesz", me: "🌊", type: "power", cost: 2, part: 12, arena: 2, info: "Boża moc: woda się rozstępuje i Twoi przejdą tędy przez rzekę" },
  { id: "arka",    name: "Arka",    me: "🚢", foe: "🏚️", type: "building", cost: 5, hp: 260, life: 30, spawns: ANIMAL, every: 4, arena: 3, info: "Arka Noego: co chwilę wypuszcza zwierzęta" },
  { id: "debora",  name: "Debora",  me: "👸", foe: "🧙", cost: 5, hp: 150, dmg: 12, range: 90, speed: 35, hero: "song", arena: 1, info: "Bohaterka. ⚡ Zdolność: pieśń leczy Twoich wokół niej" },
  { id: "daniel",  name: "Daniel",  me: "🧔", foe: "🤴", cost: 6, hp: 200, dmg: 14, range: 20, speed: 35, hero: "lions", arena: 2, info: "Bohater. ⚡ Zdolność: przywołuje 2 przyjazne lwy" },
  { id: "michal",  name: "Michał",  me: "👼", foe: "🐉", cost: 6, hp: 200, dmg: 25, range: 20, speed: 50, air: true, arena: 2, info: "Archanioł: lata, najmocniejszy" },
];
const DEFAULT_DECK = ["trebacz", "dawid", "gedeon", "lew", "jozue", "samson", "grad", "blogo"];
const ARENAS = [
  { name: "🏜️ Pustynia",     min: 0,   tint: "rgba(230,190,110,.14)" },
  { name: "🧱 Jerycho",       min: 100, tint: "rgba(200,110,60,.12)" },
  { name: "🏛️ Jerozolima",    min: 250, tint: "rgba(110,120,210,.12)" },
  { name: "🌈 Złote Miasto",  min: 500, tint: "rgba(255,215,0,.16)" },
];
// rate = jak szybko przeciwnik zbiera mannę, hp = siła jego postaci, smart = broni się tam, gdzie atakujesz
const DIFFS = [
  { name: "🐑 Łatwy",  rate: 0.9, hp: 1,    smart: false },
  { name: "🦁 Średni", rate: 1.2, hp: 1.15, smart: true },
  { name: "🐉 Trudny", rate: 1.6, hp: 1.35, smart: true },
];
// tryby specjalne: na bazie poziomu średniego
const MODES = [
  { name: "⚡ Potrójna manna", mana: 3 },
  { name: "🤝 2 na 2 z pomocnikiem", team: true },
  { name: "🎲 Losowa talia", random: true },
  { name: "🃏 Wybierz karty", draft: true },
].map(m => ({ ...DIFFS[1], ...m }));
const DUO = { name: "👫 We dwoje", rate: 1, hp: 1, smart: false, duo: true };
// kampania: kolejne bitwy z historią; level = numer etapu
const CAMPAIGN = [
  { e: "🐑", name: "Pasterz Dawid", rate: 1, hp: 1, smart: false,
    story: "Dawid pasł owce swojego taty. Gdy przyszedł lew i niedźwiedź, Bóg dał mu odwagę, by obronić stado. Obroń swój obóz!" },
  { e: "🎺", name: "Mury Jerycha", rate: 1.1, hp: 1.1, smart: true,
    story: "Jozue i lud obchodzili Jerycho, a gdy zagrały trąby i wszyscy zawołali, mury upadły. Zburz wieże przeciwnika!" },
  { e: "🏺", name: "Gedeon i 300", rate: 1.3, hp: 1.15, smart: true,
    story: "Gedeon miał tylko 300 ludzi z trąbami, dzbanami i pochodniami, ale Bóg był z nimi. Nie bój się, że jest was mało!" },
  { e: "🔥", name: "Eliasz na Karmelu", rate: 1.45, hp: 1.25, smart: true,
    story: "Eliasz modlił się, a Bóg zesłał ogień z nieba. Zaufaj Bożej mocy!" },
  { e: "🧌", name: "Dawid i Goliat", rate: 1.4, hp: 1.25, smart: true, boss: true,
    story: "Olbrzym Goliat szydził z Boga. Mały Dawid wyszedł do niego z procą w imię Pana. Uwaga: Goliat co chwilę wraca do walki!" },
];
CAMPAIGN.forEach((c, i) => c.level = i);
// zadania dnia: codziennie 3 inne z tej listy
const QUESTS = [
  { id: "win",    key: "win",    goal: 1,  text: "Wygraj bitwę" },
  { id: "riddle", key: "riddle", goal: 3,  text: "Odpowiedz dobrze na 3 zagadki" },
  { id: "tower",  key: "tower",  goal: 3,  text: "Zburz 3 wieże przeciwnika" },
  { id: "power",  key: "power",  goal: 5,  text: "Użyj 5 razy Bożej mocy" },
  { id: "play",   key: "play",   goal: 20, text: "Wystaw 20 kart" },
  { id: "three",  key: "three",  goal: 1,  text: "Wygraj z 3 koronami" },
];
const BADGES = [
  { e: "🥇", name: "Pierwsze zwycięstwo",       ok: () => (save.stats.win || 0) >= 1 },
  { e: "🏅", name: "10 zwycięstw",              ok: () => (save.stats.win || 0) >= 10 },
  { e: "👑", name: "Wygrana z 3 koronami",      ok: () => (save.stats.three || 0) >= 1 },
  { e: "📖", name: "Znawca Biblii: 20 zagadek", ok: () => (save.stats.riddle || 0) >= 20 },
  { e: "🙏", name: "30 razy Boża moc",          ok: () => (save.stats.power || 0) >= 30 },
  { e: "🧌", name: "Pogromca Goliata",          ok: () => save.campaign >= CAMPAIGN.length },
];
// first answer is the correct one
const QUESTIONS = [
  ["Kto zbudował arkę?", "Noe", "Mojżesz", "Dawid"],
  ["Kogo połknęła wielka ryba?", "Jonasza", "Daniela", "Eliasza"],
  ["Czym Dawid pokonał Goliata?", "Procą i kamieniem", "Mieczem", "Łukiem"],
  ["Gdzie urodził się Pan Jezus?", "W Betlejem", "W Rzymie", "W Nazarecie"],
  ["Ilu apostołów wybrał Jezus?", "Dwunastu", "Trzech", "Czterdziestu"],
  ["Co Bóg pokazał na niebie po potopie?", "Tęczę", "Księżyc", "Kometę"],
  ["Kogo wrzucono do jaskini lwów?", "Daniela", "Dawida", "Pawła"],
  ["Ile przykazań dał Bóg Mojżeszowi?", "Dziesięć", "Trzy", "Sto"],
  ["Kto był najsilniejszym człowiekiem w Biblii?", "Samson", "Jonasz", "Mateusz"],
  ["Ile chlebów rozmnożył Jezus, by nakarmić tłum?", "Pięć", "Dwa", "Sto"],
  ["Co się stało z murami Jerycha, gdy zagrały trąby Jozuego?", "Upadły", "Urosły", "Zniknęły pod wodą"],
  ["Z iloma wojownikami Gedeon pokonał Madianitów?", "Z trzystoma", "Z tysiącem", "Z dwoma"],
  ["Kto przynosił prorokowi Eliaszowi jedzenie na pustyni?", "Kruki", "Lwy", "Rybacy"],
  ["Jakiego ptaka wypuścił Noe z arki?", "Gołębicę", "Orła", "Wronę"],
  ["Kto odbudował mury Jerozolimy?", "Nehemiasz", "Samson", "Jonasz"],
  ["Czym Bóg karmił Izraelitów na pustyni?", "Manną z nieba", "Pizzą", "Jabłkami"],
];
const EMOJI_FONT = "'Trebuchet MS','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";

const $ = id => document.getElementById(id);
const canvas = $("c"), ctx = canvas.getContext("2d"), dlg = $("dlg"), askBtn = $("ask");
const say = t => { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "pl-PL"; speechSynthesis.speak(u); };
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(p => p[1]);
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const byId = id => CARDS.find(c => c.id === id);
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches; // bez trzęsienia ekranu

// --- zapis postępu (puchary, karty, talia) w przeglądarce ---
const SAVE = "bitwa-dawida-v1";
let save = null;
try { save = JSON.parse(localStorage.getItem(SAVE)); } catch {}
if (!save || !save.cards) save = { trophies: 0, best: 0, deck: [...DEFAULT_DECK], cards: {}, sound: true };
CARDS.forEach(c => save.cards[c.id] ??= { lvl: 1, copies: 0 });
save.stats ??= {}; save.campaign ??= 0; save.gold ??= 0; save.plays ??= {};
const month = new Date().toISOString().slice(0, 7);
if (save.season?.id !== month) save.season = { id: month, crowns: 0, claimed: 0 }; // nowa ścieżka co miesiąc
const today = Math.floor((Date.now() - new Date().getTimezoneOffset() * 6e4) / 864e5); // numer dnia wg zegara dziecka
if (save.daily?.day !== today) save.daily = { day: today, prog: {}, claimed: [] };
if (save.shop?.day !== today) save.shop = { day: today, bought: [] };
const shopOffers = () => { const p = CARDS.filter(unlocked); return [...new Set([0, 5, 10].map(k => p[(today * 7 + k) % p.length]))]; };
const SHOP_PRICE = 25, SEASON_STEP = 5, SEASON_TIERS = 10;
const todayQuests = () => [0, 2, 4].map(k => QUESTS[(today + k) % QUESTS.length]);
const store = () => { try { localStorage.setItem(SAVE, JSON.stringify(save)); } catch {} };
const arenaIdx = () => ARENAS.reduce((a, ar, i) => save.best >= ar.min ? i : a, 0); // areny nie cofają się po porażce
const unlocked = c => c.arena <= arenaIdx();
save.deck = save.deck.filter(id => byId(id) && unlocked(byId(id)));
const EVO = 5;                                             // od tego poziomu karta ewoluuje
const need = lvl => lvl * 2;                                // ile kopii trzeba na następny poziom

// --- dźwięk: wszystko generowane w przeglądarce, bez plików ---
let ac = null, master = null;
function initAudio() {
  if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.connect(ac.destination); } catch { ac = null; }
  if (ac) { ac.resume(); master.gain.value = save.sound ? 1 : 0; }
}
function tone(freq, dur, type = "sine", vol = 0.15, delay = 0, slide = 0) {
  if (!ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur);
}
function noise(dur, vol) {
  if (!ac) return;
  const buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = buf; f.type = "lowpass"; f.frequency.value = 700; g.gain.value = vol;
  s.connect(f).connect(g).connect(master); s.start();
}
const SFX = {
  spawn: () => tone(500, 0.15, "sine", 0.12, 0, 1000),
  hit:   () => tone(140, 0.06, "square", 0.04),
  shoot: () => tone(900, 0.1, "triangle", 0.05, 0, 400),
  boom:  () => noise(0.6, 0.4),
  bless: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.4, "sine", 0.08, i * 0.08)),
  win:   () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.3, "triangle", 0.12, i * 0.15)),
  lose:  () => [392, 349, 330, 262].forEach((f, i) => tone(f, 0.4, "triangle", 0.1, i * 0.2)),
};
const lastSfx = {};
function sfx(n) {
  if (!ac || !save.sound) return;
  if (ac.currentTime - (lastSfx[n] || 0) < 0.06) return; // nie sto trafień naraz
  lastSfx[n] = ac.currentTime; SFX[n]();
}
const MELODY = [523, 587, 659, 784, 659, 587, 523, 440, 392, 440, 523, 587, 523, 440, 392, 0];
let beat = 0, musicTimer = 0;
function music(on) {
  clearInterval(musicTimer);
  if (on) musicTimer = setInterval(() => {
    if (!ac || !save.sound || paused) return;
    const f = MELODY[beat % MELODY.length];
    if (f) tone(f, 0.35, "triangle", 0.03);
    if (beat % 4 === 0) tone(196, 0.6, "sine", 0.04);
    beat++;

}

const mkTower = (side, x, y, king) => ({ side, x, y, hp: king ? 600 : 350, max: king ? 600 : 350, dmg: king ? 12 : 9, range: king ? 125 : 115,
  speed: 0, emoji: side ? (king ? "🏯" : "🗼") : (king ? "⛺" : "🛖"), cd: 0, tower: true, king, active: !king, flash: 0 });
const towers = [
  mkTower(0, W / 2, H - 40, true), mkTower(0, W / 4, H - 108, false), mkTower(0, W * 3 / 4, H - 108, false),
  mkTower(1, W / 2, 40, true),     mkTower(1, W / 4, 108, false),     mkTower(1, W * 3 / 4, 108, false),
];
let units = [...towers], shots = [], fx = [];
let diff = DIFFS[0], mana = [5, 5, 5, 5], brains = [], paused = true, askCd = 0, over = false, time = 0;
let cycles = [[], []], hands = [[], []], sel = [0, 0], armed = -1; // [gracz 1 (dół), gracz 2 / przeciwnik (góra)]
let parted = [null, null], emos = [null, null], bossT = 6, badgesBefore = [];
let msg = "", msgT = 0, T = 0, shake = 0, nextId = 0;
const notice = t => { msg = t; msgT = 1.5; };

// korony zdobyte przez stronę `side`: 1 za boczną wieżę, 3 za główną
const crownsOf = side => {
  const enemy = towers.filter(t => t.side !== side);
  return enemy.find(t => t.king).hp <= 0 ? 3 : enemy.filter(t => t.hp <= 0).length;
};

// dokąd iść teraz: prosto do celu, albo najpierw do najbliższego mostu i przez niego
// mosty + przejście przez rozstąpioną wodę (tylko dla strony, która zesłała Mojżesza)
const crossings = u => parted[u.side] ? [...BRIDGES, parted[u.side].x] : BRIDGES;
function waypoint(u, tx, ty) {
  const below = u.y > H / 2;
  if (u.air || below === ty > H / 2) return [tx, ty];
  const bx = crossings(u).reduce((a, b) => Math.abs(u.x - b) < Math.abs(u.x - a) ? b : a);
  if (Math.abs(u.x - bx) > 10) return [bx, H / 2 + (below ? 24 : -24)]; // podejdź do wejścia na most
  return [bx, H / 2 + (below ? -24 : 24)];                               // przejdź na drugą stronę
}

// kto kogo może zaatakować: latających trafiają tylko strzelający, wieże i inni latający
const canHit = (u, o) => (!o.air || u.air || u.range > 50 || u.tower) && (!u.onlyBuildings || o.tower || o.building);

// --- efekty ---
function burst(x, y, n, colors, { speed = 80, life = 0.6, size = 4 } = {}) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = speed * (0.3 + Math.random());
    fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, color: colors[i % colors.length], size });
  }
}
const floatText = (x, y, text, color, size = 16, outline = true) => fx.push({ x, y, vx: 0, vy: -45, life: 0.9, max: 0.9, text, color, size, outline });
const ring = (x, y, color, r = 36) => fx.push({ x, y, ring: true, r, life: 0.5, max: 0.5, color });

function damage(t, dmg) {
  if (t.hp <= 0) return;
  dmg = Math.round(dmg);
  t.hp -= dmg; t.flash = 0.15;
  if (t.king) t.active = true; // główna wieża budzi się, gdy ktoś ją zaatakuje
  floatText(t.x + (Math.random() - 0.5) * 16, t.y - 22, "-" + dmg, t.side ? "#fff" : "#ffd2d2", 15);
  sfx("hit");
  if (t.tower && !calm) shake = Math.max(shake, 0.15);
  if (t.hp > 0) return;
  if (t.tower) {
    burst(t.x, t.y, 70, ["#e67e22", "#f1c40f", "#7f8c8d", "#c0392b"], { speed: 220, life: 1.2, size: 6 });
    shake = calm ? 0 : 0.6; sfx("boom");
    towers.forEach(k => { if (k.king && k.side === t.side) k.active = true; });
  } else {
    burst(t.x, t.y, 14, ["#ecf0f1", "#bdc3c7", "#fff"], { speed: 60, size: 6 });
    fx.push({ x: t.x, y: t.y, vx: 0, vy: -25, life: 0.7, max: 0.7, text: "💨", size: 26 });
  }
}

function attack(u, t) {
  if (u.range > 50) { shots.push({ x: u.x, y: u.y - 10, px: u.x, py: u.y - 10, t, dmg: u.dmg, color: u.side ? "#c0392b" : "#95a5a6" }); sfx("shoot"); return; }
  damage(t, (t.tower || t.building) && u.siege ? u.dmg * 3 : u.dmg);
  if (u.splash) for (const o of units)
    if (o !== t && o.side !== u.side && o.hp > 0 && !o.tower && canHit(u, o) && dist(o, t) < u.splash) damage(o, u.dmg);
  burst((u.x + t.x) / 2, (u.y + t.y) / 2, u.splash ? 14 : 6, ["#fff", "#f1c40f"], { speed: u.splash ? 140 : 90, life: 0.3, size: 3 });
  if (u.splash) ring(t.x, t.y, "#fff", u.splash);
}

function spawn(side, c, x, y, m = 1) {
  if (c.type === "power") return power(side, c, x, y, m);
  const n = c.count || 1, hp = Math.round(c.hp * m);
  for (let k = 0; k < n; k++)
    units.push({ id: nextId++, side, x: x + (k - (n - 1) / 2) * 24, y, hp, max: hp, dmg: Math.round((c.dmg || 0) * m), range: c.range || 0,
                 speed: c.speed || 0, air: c.air, building: c.type === "building", splash: c.splash, siege: c.siege,
                 onlyBuildings: c.onlyBuildings, emoji: side ? c.foe : c.me, cd: 0, flash: 0,
                 big: c.big, life: c.life, spawns: c.spawns, every: c.every, spawnT: 1, m, hero: c.hero, name: c.name, abT: 3 });
  ring(x, y + 12, side ? "#e74c3c" : "#3498db");
  for (let i = 0; i < 3; i++) fx.push({ x: x + (Math.random() - 0.5) * 30, y: y + (Math.random() - 0.5) * 20, vx: 0, vy: -30, life: 0.6, max: 0.6, text: "✨", size: 14 });
  sfx("spawn");
}

// Boża moc: grad rani wrogów, błogosławieństwo leczy swoich
function power(side, c, x, y, m) {
  if (c.heal) {
    for (const o of units) if (o.side === side && !o.tower && o.hp > 0 && dist(o, { x, y }) < c.radius) {
      const h = Math.round(c.heal * m); o.hp = Math.min(o.max, o.hp + h); floatText(o.x, o.y - 24, "+" + h, "#2ecc71", 15);
    }
    ring(x, y, "#f1c40f", c.radius); burst(x, y, 24, ["#f1c40f", "#fff6b0", "#fff"], { speed: 90, life: 0.9 });
    for (let i = 0; i < 6; i++) fx.push({ x: x + (Math.random() - 0.5) * c.radius, y: y + (Math.random() - 0.5) * c.radius, vx: 0, vy: -35, life: 0.9, max: 0.9, text: "✨", size: 16 });
    sfx("bless");
  } else if (c.part) {
    parted[side] = { x: clamp(x, 30, W - 30), t: c.part };
    burst(parted[side].x, H / 2, 30, ["#86ccf5", "#fff", "#4a9fd8"], { speed: 110, life: 0.8 });
    sfx("bless");
  } else if (c.towerDmg) {
    for (let i = 0; i < 5; i++) fx.push({ x: x + (Math.random() - 0.5) * 60, y: y + 20, vx: (Math.random() - 0.5) * 40, vy: -50, life: 1, max: 1, text: "📯", size: 18 });
    ring(x, y, "#f1c40f", c.radius + 20);
    for (const o of towers) if (o.side !== side && o.hp > 0 && dist(o, { x, y }) < c.radius + 20) damage(o, c.towerDmg * m);
    [392, 523, 659].forEach((f, i) => tone(f, 0.5, "sawtooth", save.sound ? 0.05 : 0, i * 0.12));
  } else {
    for (let i = 0; i < 16; i++) fx.push({ x: x + (Math.random() - 0.5) * c.radius * 1.6, y: y - 90 - Math.random() * 40, vx: 0, vy: 380, life: 0.3, max: 0.3, text: "🧊", size: 14 });
    ring(x, y, "#dff4ff", c.radius); burst(x, y, 20, ["#dff4ff", "#a9d6f5", "#fff"], { speed: 120, life: 0.5 });
    for (const o of units) if (o.side !== side && o.hp > 0 && dist(o, { x, y }) < c.radius) damage(o, c.dmg * m * (o.tower ? 0.4 : 1));
    if (!calm) shake = Math.max(shake, 0.2);
    sfx("boom");
  }
}

canvas.addEventListener("pointerdown", e => {
  if (paused || over) return;
  const r = canvas.getBoundingClientRect();
  let x = clamp((e.clientX - r.left) * W / r.width, 20, W - 20), y = (e.clientY - r.top) * H / r.height;
  // we dwoje: Boża moc należy do tego, kto ją właśnie wybrał; postać do tego, na czyjej połowie dotknięto
  let s = 0;
  if (diff.duo) s = armed >= 0 && byId(hands[armed][sel[armed]]).type === "power" ? armed : y < H / 2 ? 1 : 0;
  const c = byId(hands[s][sel[s]]);
  if (mana[s] < c.cost) return notice(`Czekaj na mannę 🍞 (potrzeba ${c.cost})`);
  if (c.type !== "power") y = s ? clamp(y, 20, H / 2 - 30) : clamp(y, H / 2 + 30, H - 20); // postacie i mury tylko na swojej połowie
  mana[s] -= c.cost;
  if (armed === s) armed = -1;
  const n0 = units.length;
  spawn(s, c, x, y, diff.duo ? 1 : mult(c.id));
  if (!s) {
    const evo = !diff.duo && save.cards[c.id].lvl >= EVO && !c.type; // ewolucja: +20% siły i złota obwódka
    for (const u of units.slice(n0)) {
      u.mine = true;
      if (evo) { u.evo = true; u.hp = u.max = Math.round(u.max * 1.2); u.dmg = Math.round(u.dmg * 1.2); }
    }
    track("play"); if (c.type === "power") track("power");
    if (!diff.duo) save.plays[c.id] = (save.plays[c.id] || 0) + 1;
  }
  hands[s][sel[s]] = cycles[s].shift(); cycles[s].push(c.id);
  renderHand(s);
});

// zdolność bohatera: Debora leczy pieśnią, Daniel przywołuje lwy
const HERO_COST = 2, HERO_CD = 10;
function heroPower(u) {
  u.abT = HERO_CD;
  floatText(u.x, u.y - 34, "⚡", "#f39c12", 22, false);
  if (u.hero === "song") {
    for (const o of units) if (o.side === u.side && !o.tower && o.hp > 0 && dist(o, u) < 100) {
      const h = Math.round(50 * u.m); o.hp = Math.min(o.max, o.hp + h); floatText(o.x, o.y - 24, "+" + h, "#2ecc71", 15);
    }
    ring(u.x, u.y, "#f1c40f", 100);
    for (let i = 0; i < 5; i++) fx.push({ x: u.x + (Math.random() - 0.5) * 80, y: u.y, vx: 0, vy: -40, life: 1, max: 1, text: "🎵", size: 16 });
    sfx("bless");
  } else {
    spawn(u.side, LIONS, u.x, u.y + (u.side ? 20 : -20), u.m);
  }
}
const myHero = () => units.find(u => u.mine && u.hero && u.hp > 0);
$("hero").onclick = () => {
  const u = myHero();
  if (!u || paused || over || u.abT > 0 || mana[0] < HERO_COST) return;
  mana[0] -= HERO_COST; heroPower(u);
};

// emotki: krótki dymek nad główną wieżą
function emote(s, e) {
  emos[s] = { e, t: 2 };
  tone(s ? 600 : 800, 0.12, "sine", 0.08);
  if (!s && !diff.duo && Math.random() < 0.5) setTimeout(() => !over && emote(1, ["😮", "🙂", "👍", "🙏"][Math.floor(Math.random() * 4)]), 900);
}
document.querySelectorAll(".emo").forEach(b => b.onclick = () => { if (!paused && !over) emote(+b.dataset.s, b.textContent); });

// postęp do zadań dnia i odznak (nie liczy się gra we dwoje)
function track(k, n = 1) {
  if (diff.duo || !n) return;
  save.stats[k] = (save.stats[k] || 0) + n;
  for (const q of todayQuests()) if (q.key === k) save.daily.prog[q.id] = Math.min(q.goal, (save.daily.prog[q.id] || 0) + n);
}

// --- przeciwnik ---
const foeMult = () => diff.hp * (1 + 0.08 * arenaIdx());
const foePick = () => { const p = CARDS.filter(c => unlocked(c) && !c.heal && !c.part); return p[Math.floor(Math.random() * p.length)]; };
// boty: b.side = strona, b.mi = która manna; przeciwnik zawsze, w trybie 2 na 2 także pomocnik i drugi przeciwnik
function foeTurn(b) {
  const c = b.next, side = b.side, mine = u => u.side === side;
  if (mana[b.mi] < c.cost) return;
  const flip = y => side ? y : H - y; // pomocnik gra od dołu
  let x, y;
  if (c.towerDmg) { // trąby na najsłabszą wieżę przeciwnika
    const t = towers.filter(t => t.side !== side && t.hp > 0).sort((a, b) => a.hp - b.hp)[0];
    x = t.x; y = t.y;
  } else if (c.type === "power") { // grad tam, gdzie stoi najwięcej wrogów
    let most = 0;
    for (const u of units) if (!mine(u) && !u.tower) {
      const n = units.filter(o => !mine(o) && !o.tower && dist(o, u) < c.radius).length;
      if (n > most) { most = n; x = u.x; y = u.y; }
    }
    if (most < 2) { b.next = foePick(); return; } // nie warto, weź inną kartę
  } else {
    // sprytny bot stawia postać naprzeciw wroga, który zaszedł najdalej
    const threat = diff.smart && units.filter(u => !mine(u) && !u.tower && !u.building).sort((p, q) => flip(p.y) - flip(q.y))[0];
    if (threat) { x = clamp(threat.x, 30, W - 30); y = flip(clamp(flip(threat.y) - 70, 80, H / 2 - 30)); }
    else { x = BRIDGES[Math.random() < 0.5 ? 0 : 1] + (Math.random() - 0.5) * 60; y = flip(c.type === "building" ? 170 : 130); }
  }
  mana[b.mi] -= c.cost;
  spawn(side, c, x, y, side ? foeMult() : 1);
  b.next = foePick();
}

// --- logika ---
function separate() { // postacie się przepychają, zamiast stać jedna na drugiej
  const mob = units.filter(u => !u.tower && !u.building && u.hp > 0);
  for (let i = 0; i < mob.length; i++) for (let j = i + 1; j < mob.length; j++) {
    const a = mob[i], b = mob[j];
    if (!a.air !== !b.air) continue;
    let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d >= 18) continue;
    if (d < 0.01) { dx = Math.random() - 0.5; dy = 0.1; d = Math.hypot(dx, dy); }
    const p = (18 - d) / 2 / d;
    a.x -= dx * p; a.y -= dy * p; b.x += dx * p; b.y += dy * p;
  }
  for (const u of mob) { // nikt nie zostaje wepchnięty do wody
    u.x = clamp(u.x, 10, W - 10);
    if (!u.air && Math.abs(u.y - H / 2) < 14 && Math.min(...crossings(u).map(b => Math.abs(u.x - b))) > 22) u.y = u.y > H / 2 ? H / 2 + 14 : H / 2 - 14;
  }
}

function step(dt) {
  time += dt;
  const rate = MANA_PER_SEC * (diff.mana || 1) * (time > TIME - 60 ? 2 : 1); // ostatnia minuta i dogrywka: manna 2× szybciej
  mana[0] = Math.min(MAX_MANA, mana[0] + rate * dt);
  for (const i of [1, 2, 3]) mana[i] = Math.min(MAX_MANA, mana[i] + rate * dt * diff.rate);
  askCd = Math.max(0, askCd - dt);
  for (const s of [0, 1]) {
    if (parted[s] && (parted[s].t -= dt) <= 0) parted[s] = null;
    if (emos[s] && (emos[s].t -= dt) <= 0) emos[s] = null;
  }
  brains.forEach(foeTurn);
  if (diff.boss && (bossT -= dt) <= 0) { // Goliat wraca co 45 s
    bossT = 45;
    spawn(1, GOLIAT, BRIDGES[Math.random() < 0.5 ? 0 : 1], 120, foeMult());
    notice("🧌 Goliat nadchodzi!"); sfx("boom");
  }
  for (const u of units) {
    u.flash -= dt; u.cd -= dt; u.moving = false;
    if (u.building) { // budowla sama się kruszy (mur w 40 s); arka co chwilę wypuszcza zwierzęta
      u.hp -= u.max / (u.life || 40) * dt;
      if (u.spawns && (u.spawnT -= dt) <= 0) {
        u.spawnT = u.every;
        spawn(u.side, u.spawns, u.x, u.y + (u.side ? 26 : -26), u.m);
        if (!u.side) units[units.length - 1].emoji = ["🐘", "🦒", "🐑", "🐻", "🐄"][Math.floor(Math.random() * 5)];
      }
      continue;
    }
    if (u.tower && (!u.active || u.hp <= 0)) continue;
    if (u.hero) { // bohaterowie botów i gracza 2 używają zdolności sami, gdy wróg jest blisko
      u.abT -= dt;
      if (!u.mine && u.abT <= 0 && units.some(o => o.side !== u.side && o.hp > 0 && !o.tower && dist(o, u) < 100)) heroPower(u);
    }
    let target = null, best = Infinity;
    for (const o of units) {
      if (o.side === u.side || o.hp <= 0 || !canHit(u, o)) continue;
      const d = dist(o, u);
      if (d < best) { best = d; target = o; }
    }
    if (u.tower) { if (best > u.range) continue; }
    else if (!target || best > 140) { // nikogo w pobliżu: idź do najbliższej wieży przeciwnika
      target = null; best = Infinity;
      for (const o of towers) if (o.side !== u.side && o.hp > 0 && dist(o, u) < best) { best = dist(o, u); target = o; }
    }
    if (!target) continue;
    const reach = u.range + (target.tower ? 30 : target.building ? 22 : 16);
    if (best > reach) {
      if (u.speed) {
        const [wx, wy] = waypoint(u, target.x, target.y), wd = Math.hypot(wx - u.x, wy - u.y) || 1;
        u.x += (wx - u.x) / wd * u.speed * dt; u.y += (wy - u.y) / wd * u.speed * dt; u.moving = true;
      }
    } else if (u.cd <= 0) { attack(u, target); u.cd = 1; }
  }
  separate();
  for (const s of shots) {
    const d = dist(s.t, s);
    s.px = s.x; s.py = s.y;
    if (d < 10 || s.t.hp <= 0) { s.done = true; damage(s.t, s.dmg); continue; }
    s.x += (s.t.x - s.x) / d * 320 * dt; s.y += (s.t.y - s.y) / d * 320 * dt;
  }
  shots = shots.filter(s => !s.done);
  units = units.filter(u => u.hp > 0 || u.tower);

  const me = crownsOf(0), foe = crownsOf(1);
  if (me === 3 || foe === 3) return end(me === 3 ? "win" : "lose");
  if (time >= TIME && me !== foe) return end(me > foe ? "win" : "lose"); // po czasie lub w dogrywce: kto ma więcej koron
  if (time >= TIME + OVERTIME) return end("draw");
}

// --- rysowanie ---
function drawUnit(u) {
  const lift = u.air ? 14 : 0, bob = (u.moving || u.air ? Math.abs(Math.sin(T * 9 + (u.id || 0))) * 4 : 0) + lift;
  ctx.fillStyle = "rgba(0,0,0,.22)";
  ctx.beginPath(); ctx.ellipse(u.x, u.y + (u.tower ? 26 : 14), u.tower ? 32 : u.air ? 9 : 13, u.tower ? 8 : u.air ? 3 : 4, 0, 0, Math.PI * 2); ctx.fill();
  if (!u.tower) {
    ctx.strokeStyle = u.evo ? "#f1c40f" : u.side ? "rgba(231,76,60,.9)" : "rgba(52,152,219,.95)"; ctx.lineWidth = u.evo ? 4 : 3;
    ctx.beginPath(); ctx.ellipse(u.x, u.y + 14, 16, 5, 0, 0, Math.PI * 2); ctx.stroke();
  }
  if (u.flash > 0) {
    ctx.fillStyle = `rgba(255,70,70,${u.flash * 4})`;
    ctx.beginPath(); ctx.arc(u.x, u.y - bob, u.tower ? 30 : 17, 0, Math.PI * 2); ctx.fill();
  }
  const jig = u.tower && u.flash > 0 ? (Math.random() - 0.5) * 4 : 0, size = u.tower ? (u.king ? 50 : 40) : u.building ? 32 : u.big ? 48 : 28;
  ctx.font = `${size}px ${EMOJI_FONT}`;
  ctx.fillStyle = "#000"; // emoji przejmują przezroczystość koloru wypełnienia
  ctx.fillText(u.hp > 0 ? u.emoji : "🔥", u.x + jig, u.y - bob);
  if (u.evo || u.hero) { ctx.font = `12px ${EMOJI_FONT}`; ctx.fillText(u.hero ? "⚡" : "⭐", u.x + 14, u.y - 14 - bob); }
  if (u.tower && u.king && !u.active && u.hp > 0) { ctx.font = `16px ${EMOJI_FONT}`; ctx.fillText("💤", u.x + 30, u.y - 28); }
  if (u.tower && u.hp <= 0) return;
  const w = u.tower ? (u.king ? 80 : 60) : u.big ? 46 : 32, h = u.tower ? 7 : 5, top = u.y - (u.tower ? 36 : u.big ? 34 : 24) - bob;
  ctx.fillStyle = "#2c2c2c"; ctx.fillRect(u.x - w / 2 - 1, top - 1, w + 2, h + 2);
  ctx.fillStyle = u.side ? "#e74c3c" : "#3498db"; ctx.fillRect(u.x - w / 2, top, w * Math.max(0, u.hp) / u.max, h);
}

const lastText = {};
const setText = (id, t) => { if (lastText[id] !== t) { lastText[id] = t; $(id).textContent = t; } };

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 24, (Math.random() - 0.5) * shake * 24);
  ctx.drawImage(bg, 0, 0, W, H);
  // rzeka Jordan z falami i mostami
  const ry = H / 2, rg = ctx.createLinearGradient(0, ry - 10, 0, ry + 10);
  rg.addColorStop(0, "#4a9fd8"); rg.addColorStop(0.5, "#86ccf5"); rg.addColorStop(1, "#4a9fd8");
  ctx.fillStyle = rg; ctx.fillRect(0, ry - 10, W, 20);
  ctx.strokeStyle = "rgba(255,255,255,.65)"; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let x = 0; x <= W; x += 6) { const y = ry + Math.sin(x / 14 + T * 3) * 3; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();
  for (const bx of BRIDGES) {
    ctx.fillStyle = "#a0522d"; ctx.fillRect(bx - 25, ry - 14, 50, 28);
    ctx.strokeStyle = "#6b3410"; ctx.lineWidth = 2;
    for (let x = bx - 25; x <= bx + 25; x += 10) { ctx.beginPath(); ctx.moveTo(x, ry - 14); ctx.lineTo(x, ry + 14); ctx.stroke(); }
  }
  for (const p of parted) if (p) { // rozstąpiona woda: pas suchego dna
    ctx.fillStyle = "#e3cf96"; ctx.fillRect(p.x - 20, ry - 11, 40, 22);
    ctx.fillStyle = "#2f7fb8"; ctx.fillRect(p.x - 23, ry - 12, 4, 24); ctx.fillRect(p.x + 19, ry - 12, 4, 24);
  }
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const s of diff.duo ? [0, 1] : [0]) { // podpowiedź: co i gdzie możesz postawić
    const cur = hands[s].length && byId(hands[s][sel[s]]);
    if (!cur || over || paused || mana[s] < cur.cost) continue;
    ctx.save();
    if (s) { ctx.translate(W, H); ctx.rotate(Math.PI); } // gracz 2 czyta od swojej strony
    ctx.font = `15px ${EMOJI_FONT}`; ctx.fillStyle = `rgba(0,0,0,${0.35 + 0.15 * Math.sin(T * 4)})`;
    const e = look(cur, s);
    ctx.fillText(cur.type === "power" ? `Dotknij, gdzie zesłać: ${e} ${cur.name}` : `Dotknij tutaj, aby postawić: ${e} ${cur.name}`, W / 2, H / 2 + 40);
    ctx.font = `13px ${EMOJI_FONT}`; ctx.fillText(cur.info, W / 2, H / 2 + 58);
    ctx.restore();
  }
  [...units].sort((a, b) => (a.air ? 1 : 0) - (b.air ? 1 : 0) || a.y - b.y).forEach(drawUnit); // latający nad resztą, bliżsi na wierzchu

  for (const s of shots) {
    ctx.strokeStyle = s.color; ctx.globalAlpha = 0.5; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(s.px - (s.x - s.px) * 3, s.py - (s.y - s.py) * 3); ctx.lineTo(s.x, s.y); ctx.stroke();
    ctx.globalAlpha = 1; ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI * 2); ctx.fill();
  }
  for (const p of fx) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 1.5));
    if (p.ring) {
      ctx.strokeStyle = p.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, (1 - p.life / p.max) * p.r + 6, 0, Math.PI * 2); ctx.stroke();
    } else if (p.text) {
      ctx.font = `bold ${p.size}px ${EMOJI_FONT}`;
      if (p.outline) { ctx.strokeStyle = "#000"; ctx.lineWidth = 3; ctx.strokeText(p.text, p.x, p.y); }
      ctx.fillStyle = p.color || "#000"; ctx.fillText(p.text, p.x, p.y);
    } else {
      ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;
  emos.forEach((m, s) => {
    if (!m) return;
    const x = W / 2 + 52, y = s ? 78 : H - 78;
    ctx.fillStyle = "#fff"; ctx.strokeStyle = s ? "#e74c3c" : "#3498db"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.font = `24px ${EMOJI_FONT}`; ctx.fillStyle = "#000"; ctx.fillText(m.e, x, y + 1);
  });
  if (msgT > 0) {
    ctx.font = `bold 18px ${EMOJI_FONT}`; ctx.lineWidth = 4; ctx.strokeStyle = "#fff";
    ctx.strokeText(msg, W / 2, H * 0.75); ctx.fillStyle = "#8e2b1f"; ctx.fillText(msg, W / 2, H * 0.75);
  }
  ctx.restore();

  // panel wokół pola
  $("fill").style.width = mana[0] * 10 + "%";
  $("foeFill").style.width = $("fill2").style.width = mana[1] * 10 + "%";
  setText("manaText", `🍞 ${Math.floor(mana[0])}`);
  setText("foeText", `🏯 ${Math.floor(mana[1])}`);
  setText("manaText2", `🍞 ${Math.floor(mana[1])}`);
  const left = Math.max(0, time < TIME ? TIME - time : TIME + OVERTIME - time), x2 = time > TIME - 60;
  setText("clock", `${time >= TIME ? "Dogr. " : "⏱"}${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, "0")}${x2 ? " ⚡" : ""}`);
  $("clock").classList.toggle("x2", x2);
  setText("crowns", `👑 ${crownsOf(0)}:${crownsOf(1)}`);
  handBtns.forEach((bs, s) => bs.forEach((b, i) => b.classList.toggle("poor", hands[s].length > 0 && mana[s] < byId(hands[s][i]).cost))); // dalej da się wybrać i poczekać
  askBtn.disabled = askCd > 0;
  const hu = myHero(), heroBtn = $("hero");
  heroBtn.hidden = !hu;
  if (hu) {
    heroBtn.disabled = hu.abT > 0 || mana[0] < HERO_COST;
    setText("hero", hu.abT > 0 ? `⚡ ${Math.ceil(hu.abT)} s` : `⚡ ${hu.name} (${HERO_COST} 🍞)`);
  }
  setText("ask", askCd > 0 ? `📖 Następna zagadka za ${Math.ceil(askCd)} s` : "📖 Zagadka = +3 🍞");
}

// --- start, zagadki, koniec ---
function start(d) {
  diff = d;
  badgesBefore = BADGES.filter(b => b.ok()).map(b => b.e);
  for (const s of [0, 1]) { cycles[s] = shuffle(s ? save.deck : d.deck || save.deck); hands[s] = cycles[s].splice(0, 4); renderHand(s); }
  brains = d.duo ? [] : [{ side: 1, mi: 1 }, ...d.team ? [{ side: 0, mi: 2 }, { side: 1, mi: 3 }] : []];
  brains.forEach(b => b.next = foePick());
  $("game").classList.toggle("duo", !!d.duo); $("p2").hidden = !d.duo; askBtn.hidden = !!d.duo;
  $("menu").hidden = true; $("game").hidden = false;
  initAudio(); music(true);
  paused = false;
}

askBtn.onclick = () => {

    const b = document.createElement("button");

        mana[0] = Math.min(MAX_MANA, mana[0] + 3); track("riddle");

        burst(W / 2, H - 80, 20, ["#f1c40f", "#e2b6ff", "#fff"], { speed: 120, life: 0.8 });
        sfx("bless");
      }
      say(ok ? "Brawo! Plus trzy manny!" : "Prawidłowa odpowiedź to: " + a[0]);

    };
    dlg.append(b);
  });

};
dlg.addEventListener("cancel", e => e.preventDefault());

// nowe kopie karty; z nadmiaru od razu wyższy poziom
function addCopies(id, k) {
  const s = save.cards[id]; let up = "";
  s.copies += k;
  while (s.copies >= need(s.lvl) && s.lvl < 10) { s.copies -= need(s.lvl); s.lvl++; up = ` ⬆️ poziom ${s.lvl}!${s.lvl === EVO ? " ⭐ ewolucja!" : ""}`; }
  return up;
}
// skrzynia: n losowych kart, z nadmiaru kopii od razu wyższy poziom
function openChest(n = 6) {
  const pool = CARDS.filter(unlocked), got = {};
  for (let i = 0; i < n; i++) { const c = pool[Math.floor(Math.random() * pool.length)]; got[c.id] = (got[c.id] || 0) + 1; }
  return `<span style="font-size:16px">${Object.entries(got).map(([id, k]) => {
    return `${byId(id).me} ${byId(id).name} ×${k}${addCopies(id, k)}`;
  }).join("<br>")}</span>`;
}

function reward(result) {
  const before = arenaIdx(), delta = { win: 30, lose: -10, draw: 0 }[result], parts = [];
  save.trophies = Math.max(0, save.trophies + delta);
  save.best = Math.max(save.best, save.trophies);
  track("tower", towers.filter(t => t.side && t.hp <= 0).length);
  track("battle");
  const gold = { win: 20, lose: 3, draw: 8 }[result];
  save.gold += gold;
  parts.push(`<p>🪙 +${gold} złota</p>`);
  const sn = save.season; // ścieżka pielgrzyma: nagroda co 5 koron
  sn.crowns += crownsOf(0);
  while (Math.floor(sn.crowns / SEASON_STEP) > sn.claimed && sn.claimed < SEASON_TIERS) {
    sn.claimed++;
    parts.push(sn.claimed % 2 ? `<p>🛤️ Etap ścieżki ${sn.claimed}: 🪙 +30 złota</p>` : `<p>🛤️ Etap ścieżki ${sn.claimed}: 🎁 ${openChest(4)}</p>`);
    if (sn.claimed % 2) save.gold += 30;
  }
  if (result === "win") {
    track("win"); if (crownsOf(0) === 3) track("three");
    parts.push(`<p>🎁 Skrzynia:<br>${openChest()}</p>`);
    if (diff.level === save.campaign) {
      save.campaign++;
      const nx = CAMPAIGN[save.campaign];
      parts.push(`<p>📜 ${nx ? `Odblokowano etap: ${nx.e} ${nx.name}` : "Kampania ukończona! Pokonałeś Goliata! 🧌"}</p>`);
    }
  }
  for (const q of todayQuests())
    if ((save.daily.prog[q.id] || 0) >= q.goal && !save.daily.claimed.includes(q.id)) {
      save.daily.claimed.push(q.id);
      parts.push(`<p>🎯 Zadanie wykonane: ${q.text}<br>🎁 ${openChest(4)}</p>`);
    }
  const newB = BADGES.filter(b => b.ok() && !badgesBefore.includes(b.e));
  if (newB.length) parts.push(`<p>🏅 Nowa odznaka: ${newB.map(b => b.e + " " + b.name).join(", ")}</p>`);
  const after = arenaIdx(), newCards = CARDS.filter(c => c.arena > before && c.arena <= after);
  if (after > before) parts.push(`<p>🎉 Nowa arena: ${ARENAS[after].name}!${newCards.length ? `<br>Nowe karty: ${newCards.map(c => c.me + " " + c.name).join(", ")}` : ""}</p>`);
  store();
  const title = { win: "Zwycięstwo!", lose: "Tym razem się nie udało.", draw: "Remis!" }[result];
  return `<p>${title}<br>👑 ${crownsOf(0)} : ${crownsOf(1)} · ${delta >= 0 ? "+" : ""}${delta} 🏆</p>` + parts.join("");
}

function end(result) {
  if (over) return;
  over = true; music(false);
  const duoTitle = { win: "Wygrywa 🔵 Niebieski!", lose: "Wygrywa 🔴 Czerwony!", draw: "Remis!" }[result];
  const body = diff.duo ? `<p>${duoTitle}<br>👑 ${crownsOf(0)} : ${crownsOf(1)}</p>` : reward(result);
  if (result === "win" || diff.duo && result !== "draw")
    for (let i = 0; i < 160; i++)
      fx.push({ x: Math.random() * W, y: -Math.random() * 200, vx: (Math.random() - 0.5) * 60, vy: 60 + Math.random() * 80, g: 20,
                life: 5, max: 5, size: 6, color: ["#e74c3c", "#f1c40f", "#2ecc71", "#3498db", "#9b59b6"][i % 5] });
  sfx(result === "lose" && !diff.duo ? "lose" : "win");
  setTimeout(() => {
    const icon = diff.duo ? (result === "draw" ? "🤝" : "🏆") : { win: "🏆", lose: "💪", draw: "🤝" }[result];
    dlg.innerHTML = `<p style="font-size:56px;margin:0">${icon}</p>${body}<button onclick="location.reload()">🏠 Wróć do menu</button>`;
    dlg.showModal();
    say(diff.duo ? duoTitle.replace(/[🔵🔴]/gu, "") : result === "win" ? "Zwycięstwo!" : result === "draw" ? "Remis!" : "Spróbuj jeszcze raz!");
  }, 1200); // najpierw widać wybuch wieży
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  T += dt; shake = Math.max(0, shake - dt); msgT -= dt;
  if (!paused && !over) step(dt);
  for (const p of fx) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; }
  fx = fx.filter(p => p.life > 0);
  if (!$("game").hidden) draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
