<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitwa Dawida</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: linear-gradient(#bfe6ff, #fdf6e3 45%);
         font-family: "Comic Sans MS", "Trebuchet MS", sans-serif; color: #3b2f1e; }
  /* szerokość liczona z wysokości ekranu, żeby całe pole + karty mieściły się w pionie */
  main { width: max(220px, min(360px, 100vw - 24px, (100vh - 320px) * 0.69)); text-align: center; padding: 6px 0; }
  @supports (height: 100dvh) { main { width: max(220px, min(360px, 100vw - 24px, (100dvh - 320px) * 0.69)); } }
  h1 { font-size: 20px; margin: 0 0 4px; color: #8b5a2b; text-shadow: 0 2px 0 #fff; }
  canvas { width: 100%; border-radius: 18px; border: 6px solid #8b5a2b; box-shadow: 0 6px 0 #5b3a1a;
           touch-action: none; display: block; box-sizing: border-box; }
  #foeRow { margin: 0 0 6px; }
  #foeFill { height: 100%; width: 0; background: linear-gradient(#ff9a8a, #c0392b); }
  #manaRow, #foeRow { display: flex; align-items: center; gap: 8px; margin: 8px 0 10px; font-size: 16px; font-weight: bold; }
  .bar { flex: 1; height: 16px; border-radius: 8px; background: #5b3a1a; border: 3px solid #e0b84f; overflow: hidden; position: relative; }
  #fill { height: 100%; width: 0; background: linear-gradient(#e2b6ff, #8e44ad); }
  .bar::after { content: ""; position: absolute; inset: 0;
                background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), rgba(0,0,0,.35) calc(10% - 2px) 10%); }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 6px; }
  button { font: inherit; font-size: 13px; padding: 4px 2px; border: 3px solid #e0b84f; border-radius: 14px;
           background: linear-gradient(#fffdf5, #f3e3b5); color: inherit; cursor: pointer; box-shadow: 0 4px 0 #c49a3a; }
  .cards button { position: relative; transition: transform .1s, filter .2s; }
  .cards button .e { display: block; font-size: 24px; }
  .cards button.sel { transform: translateY(-3px); border-color: #c48a00; box-shadow: 0 7px 0 #c48a00, 0 0 0 3px #ffd84d; }
  .cards button.poor { filter: grayscale(.8); opacity: .6; }
  .cost { position: absolute; top: -8px; right: -6px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
          background: #8e44ad; color: #fff; border: 2px solid #fff; font-size: 14px; font-weight: bold; }
  #ask { width: 100%; margin-top: 10px; font-size: 16px; padding: 6px; background: linear-gradient(#fff6d5, #f7d774); }
  #ask:disabled { opacity: .55; cursor: default; }
  dialog { border: 4px solid #e0b84f; border-radius: 20px; max-width: 420px; text-align: center; background: #fffaf0; color: inherit; }
  dialog[open] { animation: pop .25s ease-out; }
  dialog::backdrop { background: rgba(40, 25, 10, .45); }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } }
  dialog p { font-size: 20px; }
  dialog button { display: block; width: 100%; margin: 10px 0; font-size: 20px; padding: 12px; }
  @media (prefers-reduced-motion: reduce) { dialog[open] { animation: none; } .cards button { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>⛺ Bitwa Dawida 🏯</h1>
  <div id="foeRow"><span id="foeText">🏯 0</span>
    <div class="bar" role="progressbar" aria-label="Manna przeciwnika" aria-valuemin="0" aria-valuemax="10"><div id="foeFill"></div></div></div>
  <canvas id="c" aria-label="Pole bitwy. Wybierz kartę i dotknij pola."></canvas>
  <div id="manaRow"><span id="manaText">🍞 0</span>
    <div class="bar" role="progressbar" aria-label="Manna" aria-valuemin="0" aria-valuemax="10"><div id="fill"></div></div></div>
  <div class="cards" id="cards"></div>
  <button id="ask">📖 Zagadka = +3 🍞</button>
</main>
<dialog id="dlg"></dialog>
<script>
const W = 360, H = 520, MAX_MANA = 10, MANA_PER_SEC = 0.5;
const BRIDGES = [W / 4, W * 3 / 4]; // przez rzekę można przejść tylko po mostach

// dokąd iść teraz: prosto do celu, albo najpierw do najbliższego mostu i przez niego
function waypoint(u, tx, ty) {
  const below = u.y > H / 2;
  if (below === ty > H / 2) return [tx, ty];
  const bx = Math.abs(u.x - BRIDGES[0]) <= Math.abs(u.x - BRIDGES[1]) ? BRIDGES[0] : BRIDGES[1];
  if (Math.abs(u.x - bx) > 4) return [bx, H / 2 + (below ? 24 : -24)]; // podejdź do wejścia na most
  return [bx, H / 2 + (below ? -24 : 24)];                              // przejdź na drugą stronę
}
// me = Twoja postać, foe = postać przeciwnika o tych samych siłach
const CARDS = [
  { name: "Trębacz", me: "🎺", foe: "🐎", cost: 2, hp: 30,  dmg: 6,  range: 20,  speed: 70, info: "Bardzo szybki" },
  { name: "Dawid",   me: "👦", foe: "🏹", cost: 3, hp: 45,  dmg: 9,  range: 100, speed: 40, info: "Rzuca kamieniami z procy" },
  { name: "Gedeon",  me: "🏺", foe: "🐫", cost: 3, hp: 22,  dmg: 5,  range: 20,  speed: 60, count: 3, info: "3 wojowników naraz" },
  { name: "Lew",     me: "🦁", foe: "🐺", cost: 4, hp: 90,  dmg: 15, range: 20,  speed: 55, info: "Silny i szybki" },
  { name: "Eliasz",  me: "🔥", foe: "🐍", cost: 4, hp: 50,  dmg: 14, range: 110, speed: 35, info: "Ogień z nieba z daleka" },
  { name: "Jozue",   me: "⚔️", foe: "🐗", cost: 4, hp: 80,  dmg: 10, range: 20,  speed: 45, siege: true, info: "Burzy mury: ×3 w wieżę" },
  { name: "Samson",  me: "💪", foe: "🛡️", cost: 5, hp: 180, dmg: 22, range: 20,  speed: 28, info: "Najsilniejszy, ale wolny" },
  { name: "Michał",  me: "👼", foe: "🐉", cost: 6, hp: 200, dmg: 25, range: 20,  speed: 50, info: "Archanioł: najmocniejszy" },
];
// first answer is the correct one
const QUESTIONS = [
  ["Kto zbudował arkę?", "Noe", "Mojżesz", "Dawid"],
  ["Kogo połknęła wielka ryba?", "Jonasza", "Daniela", "Eliasza"],
  ["Czym Dawid pokonał Goliata?", "Procą i kamieniem", "Mieczem", "Łukiem"],
  ["Gdzie urodził się Pan Jezus?", "W Betlejem", "W Rzymie", "W Nazarecie"],
  ["Ilu apostołów wybrał Jezus?", "Dwunastu", "Trzech", "Czterdziestu"],
  ["Co Bóg pokazał na niebie po potopie?", "Tęczę", "Księżyc", "Kometę"],
  ["Kogo wrzucono do jaskini lwów?", "Daniela", "Dawida", "Pawła"],
  ["Ile przykazań dał Bóg Mojżeszowi?", "Dziesięć", "Trzy", "Sto"],
  ["Kto był najsilniejszym człowiekiem w Biblii?", "Samson", "Jonasz", "Mateusz"],
  ["Ile chlebów rozmnożył Jezus, by nakarmić tłum?", "Pięć", "Dwa", "Sto"],
  ["Co się stało z murami Jerycha, gdy zagrały trąby Jozuego?", "Upadły", "Urosły", "Zniknęły pod wodą"],
  ["Z iloma wojownikami Gedeon pokonał Madianitów?", "Z trzystoma", "Z tysiącem", "Z dwoma"],
  ["Kto przynosił prorokowi Eliaszowi jedzenie na pustyni?", "Kruki", "Lwy", "Rybacy"],
];
// rate = jak szybko przeciwnik zbiera mannę, hp = siła jego postaci, smart = broni się tam, gdzie atakujesz
const LEVELS = [
  { name: "🐑 Łatwy",  rate: 0.9,  hp: 1,   smart: false },
  { name: "🦁 Średni", rate: 1.2,  hp: 1.15, smart: true },
  { name: "🐉 Trudny", rate: 1.6,  hp: 1.35, smart: true },
];
const EMOJI_FONT = "'Trebuchet MS','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";

const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
const dlg = document.getElementById("dlg"), askBtn = document.getElementById("ask");
const foeFill = document.getElementById("foeFill"), foeText = document.getElementById("foeText");
const fill = document.getElementById("fill"), manaText = document.getElementById("manaText"), bar = fill.parentElement;
const say = t => { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "pl-PL"; speechSynthesis.speak(u); };
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(p => p[1]);
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches; // bez trzęsienia ekranu

// ostry obraz na ekranach Retina
const dpr = Math.min(2, window.devicePixelRatio || 1);
canvas.width = W * dpr; canvas.height = H * dpr; ctx.scale(dpr, dpr);

// tło rysowane raz: trawa, droga, kwiatki
const bg = document.createElement("canvas");
bg.width = W * dpr; bg.height = H * dpr;
{
  const b = bg.getContext("2d"); b.scale(dpr, dpr);
  const g = b.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#86c262"); g.addColorStop(0.5, "#a8d88a"); g.addColorStop(1, "#b9e39a");
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  b.fillStyle = "rgba(120,60,40,.08)"; b.fillRect(0, 0, W, H / 2);
  for (let i = 0; i < 300; i++) { b.fillStyle = `rgba(50,110,35,${0.15 + Math.random() * 0.25})`; b.fillRect(Math.random() * W, Math.random() * H, 2, 5); }
  b.strokeStyle = "rgba(227,207,150,.75)"; b.lineWidth = 34; b.lineJoin = b.lineCap = "round";
  for (const bx of BRIDGES) { b.beginPath(); b.moveTo(W / 2, 60); b.lineTo(bx, H / 2 - 40); b.lineTo(bx, H / 2 + 40); b.lineTo(W / 2, H - 60); b.stroke(); }
  b.font = `15px ${EMOJI_FONT}`; b.textAlign = "center";
  [[30, 150], [320, 200], [50, 330], [300, 420], [80, 470], [290, 90], [24, 250], [338, 300], [140, 120], [230, 400]]
    .forEach(([x, y], i) => b.fillText(["🌼", "🌷", "🌿"][i % 3], x, y));
}

const tower = (side, y, emoji) => ({ side, x: W / 2, y, hp: 500, max: 500, dmg: 10, range: 120, speed: 0, emoji, cd: 0, tower: true, flash: 0 });
const myTower = tower(0, H - 44, "⛺"), foeTower = tower(1, 44, "🏯");
let units = [myTower, foeTower], shots = [], fx = [];
let level = LEVELS[0], mana = 5, foeMana = 5, foeNext = 0, selected = 0, paused = true, askCd = 0, over = false;
let msg = "", msgT = 0, T = 0, shake = 0, nextId = 0;
const flash = t => { msg = t; msgT = 1.5; };

// --- efekty ---
function burst(x, y, n, colors, { speed = 80, life = 0.6, size = 4, g = 0, up = 0 } = {}) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = speed * (0.3 + Math.random());
    fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - up, life, max: life, color: colors[i % colors.length], size, g });
  }
}
const floatText = (x, y, text, color, size = 16, outline = true) => fx.push({ x, y, vx: 0, vy: -45, life: 0.9, max: 0.9, text, color, size, outline });

function damage(t, dmg) {
  if (t.hp <= 0) return;
  t.hp -= dmg; t.flash = 0.15;
  floatText(t.x + (Math.random() - 0.5) * 16, t.y - 22, "-" + dmg, t.side ? "#fff" : "#ffd2d2", 15);
  if (t.tower && !calm) shake = Math.max(shake, 0.15);
  if (t.hp > 0) return;
  if (t.tower) { burst(t.x, t.y, 70, ["#e67e22", "#f1c40f", "#7f8c8d", "#c0392b"], { speed: 220, life: 1.2, size: 6 }); shake = calm ? 0 : 0.6; }
  else { burst(t.x, t.y, 14, ["#ecf0f1", "#bdc3c7", "#fff"], { speed: 60, size: 6 }); fx.push({ x: t.x, y: t.y, vx: 0, vy: -25, life: 0.7, max: 0.7, text: "💨", size: 26 }); }
}

function attack(u, t) {
  if (u.range > 50) shots.push({ x: u.x, y: u.y - 10, px: u.x, py: u.y - 10, t, dmg: u.dmg, color: u.side ? "#c0392b" : "#95a5a6" });
  else { damage(t, t.tower && u.siege ? u.dmg * 3 : u.dmg); burst((u.x + t.x) / 2, (u.y + t.y) / 2, 6, ["#fff", "#f1c40f"], { speed: 90, life: 0.3, size: 3 }); }
}

function spawn(side, card, x, y) {
  const c = CARDS[card];
  const n = c.count || 1, hp = Math.round(c.hp * (side ? level.hp : 1));
  for (let k = 0; k < n; k++)
    units.push({ id: nextId++, side, x: x + (k - (n - 1) / 2) * 24, y, hp, max: hp, dmg: c.dmg, range: c.range, speed: c.speed,
                 siege: c.siege, emoji: side ? c.foe : c.me, cd: 0, flash: 0 });
  fx.push({ x, y: y + 12, ring: true, life: 0.5, max: 0.5, color: side ? "#e74c3c" : "#3498db" });
  for (let i = 0; i < 3; i++) fx.push({ x: x + (Math.random() - 0.5) * 30, y: y + (Math.random() - 0.5) * 20, vx: 0, vy: -30, life: 0.6, max: 0.6, text: "✨", size: 14 });
}

// --- karty i sterowanie ---
const cardBtns = CARDS.map((c, i) => {
  const b = document.createElement("button");
  b.innerHTML = `<span class="cost">${c.cost}</span><span class="e">${c.me}</span>${c.name}`;
  b.setAttribute("aria-label", `${c.name}, koszt ${c.cost} manny`);
  b.onclick = () => { selected = i; cardBtns.forEach((x, j) => x.classList.toggle("sel", j === i)); };
  document.getElementById("cards").append(b);
  return b;
});
cardBtns[0].classList.add("sel");

canvas.addEventListener("pointerdown", e => {
  if (paused || over) return;
  if (mana < CARDS[selected].cost) return flash(`Czekaj na mannę 🍞 (potrzeba ${CARDS[selected].cost})`);
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  mana -= CARDS[selected].cost;
  // klik na górnej połowie też działa: postać staje tuż przy rzece
  spawn(0, selected, Math.min(Math.max(x, 20), W - 20), Math.min(Math.max(y, H / 2 + 30), H - 20));
});

// --- logika ---
function step(dt) {
  mana = Math.min(MAX_MANA, mana + MANA_PER_SEC * dt);
  foeMana = Math.min(MAX_MANA, foeMana + MANA_PER_SEC * dt * level.rate);
  askCd = Math.max(0, askCd - dt);
  if (foeMana >= CARDS[foeNext].cost) {
    foeMana -= CARDS[foeNext].cost;
    // sprytny przeciwnik stawia postać naprzeciw Twojej, która jest najbliżej jego wieży
    const threat = level.smart && units.filter(u => !u.side && !u.tower).sort((a, b) => a.y - b.y)[0];
    spawn(1, foeNext, threat ? Math.min(Math.max(threat.x, 40), W - 40) : 40 + Math.random() * (W - 80), threat ? Math.max(90, Math.min(threat.y - 70, 200)) : 110);
    foeNext = Math.floor(Math.random() * CARDS.length);
  }
  for (const u of units) {
    u.flash -= dt; u.cd -= dt; u.moving = false;
    let target = null, best = Infinity;
    for (const o of units) {
      if (o.side === u.side || o.hp <= 0) continue;
      const d = Math.hypot(o.x - u.x, o.y - u.y);
      if (d < best) { best = d; target = o; }
    }
    if (!u.tower && best > 140) { target = u.side ? myTower : foeTower; best = Math.hypot(target.x - u.x, target.y - u.y); }
    if (!target) continue;
    const reach = u.range + (target.tower ? 30 : 16);
    if (best > reach) {
      if (u.speed) {
        const [wx, wy] = waypoint(u, target.x, target.y), wd = Math.hypot(wx - u.x, wy - u.y) || 1;
        u.x += (wx - u.x) / wd * u.speed * dt; u.y += (wy - u.y) / wd * u.speed * dt; u.moving = true;
      }
    } else if (u.cd <= 0) { attack(u, target); u.cd = 1; }
  }
  for (const s of shots) {
    const d = Math.hypot(s.t.x - s.x, s.t.y - s.y);
    s.px = s.x; s.py = s.y;
    if (d < 10 || s.t.hp <= 0) { s.done = true; damage(s.t, s.dmg); continue; }
    s.x += (s.t.x - s.x) / d * 320 * dt; s.y += (s.t.y - s.y) / d * 320 * dt;
  }
  shots = shots.filter(s => !s.done);
  units = units.filter(u => u.hp > 0 || u.tower);
  if (myTower.hp <= 0 || foeTower.hp <= 0) end(foeTower.hp <= 0);
}

// --- rysowanie ---
function drawUnit(u) {
  const bob = u.moving ? Math.abs(Math.sin(T * 9 + u.id)) * 4 : 0;
  ctx.fillStyle = "rgba(0,0,0,.22)";
  ctx.beginPath(); ctx.ellipse(u.x, u.y + (u.tower ? 26 : 14), u.tower ? 36 : 13, u.tower ? 9 : 4, 0, 0, Math.PI * 2); ctx.fill();
  if (!u.tower) {
    ctx.strokeStyle = u.side ? "rgba(231,76,60,.9)" : "rgba(52,152,219,.95)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(u.x, u.y + 14, 16, 5, 0, 0, Math.PI * 2); ctx.stroke();
  }
  if (u.flash > 0) {
    ctx.fillStyle = `rgba(255,70,70,${u.flash * 4})`;
    ctx.beginPath(); ctx.arc(u.x, u.y - bob, u.tower ? 32 : 17, 0, Math.PI * 2); ctx.fill();
  }
  const jig = u.tower && u.flash > 0 ? (Math.random() - 0.5) * 4 : 0;
  ctx.font = `${u.tower ? 52 : 28}px ${EMOJI_FONT}`;
  ctx.fillStyle = "#000"; // emoji przejmują przezroczystość koloru wypełnienia
  ctx.fillText(u.hp > 0 ? u.emoji : "🔥", u.x + jig, u.y - bob);
  const w = u.tower ? 84 : 32, h = u.tower ? 8 : 5, top = u.y - (u.tower ? 40 : 24) - bob;
  ctx.fillStyle = "#2c2c2c"; ctx.fillRect(u.x - w / 2 - 1, top - 1, w + 2, h + 2);
  ctx.fillStyle = u.side ? "#e74c3c" : "#3498db"; ctx.fillRect(u.x - w / 2, top, w * Math.max(0, u.hp) / u.max, h);
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 24, (Math.random() - 0.5) * shake * 24);
  ctx.drawImage(bg, 0, 0, W, H);
  // rzeka Jordan z falami i mostem
  const ry = H / 2, rg = ctx.createLinearGradient(0, ry - 10, 0, ry + 10);
  rg.addColorStop(0, "#4a9fd8"); rg.addColorStop(0.5, "#86ccf5"); rg.addColorStop(1, "#4a9fd8");
  ctx.fillStyle = rg; ctx.fillRect(0, ry - 10, W, 20);
  ctx.strokeStyle = "rgba(255,255,255,.65)"; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let x = 0; x <= W; x += 6) { const y = ry + Math.sin(x / 14 + T * 3) * 3; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();
  for (const bx of BRIDGES) {
    ctx.fillStyle = "#a0522d"; ctx.fillRect(bx - 25, ry - 14, 50, 28);
    ctx.strokeStyle = "#6b3410"; ctx.lineWidth = 2;
    for (let x = bx - 25; x <= bx + 25; x += 10) { ctx.beginPath(); ctx.moveTo(x, ry - 14); ctx.lineTo(x, ry + 14); ctx.stroke(); }
  }

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if (!over && mana >= CARDS[selected].cost) { // podpowiedź: tu możesz postawić wybraną postać
    ctx.font = `16px ${EMOJI_FONT}`; ctx.fillStyle = `rgba(0,0,0,${0.35 + 0.15 * Math.sin(T * 4)})`;
    ctx.fillText(`Dotknij tutaj, aby postawić: ${CARDS[selected].me} ${CARDS[selected].name}`, W / 2, H / 2 + 40);
    ctx.font = `14px ${EMOJI_FONT}`; ctx.fillText(CARDS[selected].info, W / 2, H / 2 + 60);
  }
  [...units].sort((a, b) => a.y - b.y).forEach(drawUnit); // bliższe postacie na wierzchu

  for (const s of shots) {
    ctx.strokeStyle = s.color; ctx.globalAlpha = 0.5; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(s.px - (s.x - s.px) * 3, s.py - (s.y - s.py) * 3); ctx.lineTo(s.x, s.y); ctx.stroke();
    ctx.globalAlpha = 1; ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI * 2); ctx.fill();
  }
  for (const p of fx) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 1.5));
    if (p.ring) {
      ctx.strokeStyle = p.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, (1 - p.life / p.max) * 36 + 6, 0, Math.PI * 2); ctx.stroke();
    } else if (p.text) {
      ctx.font = `bold ${p.size}px ${EMOJI_FONT}`;
      if (p.outline) { ctx.strokeStyle = "#000"; ctx.lineWidth = 3; ctx.strokeText(p.text, p.x, p.y); }
      ctx.fillStyle = p.color || "#000"; ctx.fillText(p.text, p.x, p.y);
    } else {
      ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;
  if (msgT > 0) {
    ctx.font = `bold 18px ${EMOJI_FONT}`; ctx.lineWidth = 4; ctx.strokeStyle = "#fff";
    ctx.strokeText(msg, W / 2, H * 0.75); ctx.fillStyle = "#8e2b1f"; ctx.fillText(msg, W / 2, H * 0.75);
  }
  ctx.restore();

  // panel pod polem: zmieniaj DOM tylko gdy coś się zmieniło (podmiana co klatkę gubi kliknięcia w Safari)
  const m = Math.floor(mana);
  fill.style.width = mana * 10 + "%";
  if (manaText.textContent !== `🍞 ${m}`) { manaText.textContent = `🍞 ${m}`; bar.setAttribute("aria-valuenow", m); }
  const fm = Math.floor(foeMana);
  foeFill.style.width = foeMana * 10 + "%";
  if (foeText.textContent !== `🏯 ${fm}`) { foeText.textContent = `🏯 ${fm}`; foeFill.parentElement.setAttribute("aria-valuenow", fm); }
  cardBtns.forEach((b, i) => b.classList.toggle("poor", mana < CARDS[i].cost)); // dalej da się wybrać i poczekać na mannę
  askBtn.disabled = askCd > 0;
  const askText = askCd > 0 ? `📖 Następna zagadka za ${Math.ceil(askCd)} s` : "📖 Zagadka = +3 🍞";
  if (askBtn.textContent !== askText) askBtn.textContent = askText;
}

// --- zagadki i koniec gry ---
askBtn.onclick = () => {
  const [q, ...a] = QUESTIONS[Math.floor(Math.random() * QUESTIONS.length)];
  paused = true;
  dlg.innerHTML = `<p>📖 ${q}</p>`;
  shuffle(a).forEach(t => {
    const b = document.createElement("button");
    b.textContent = t;
    b.onclick = () => {
      const ok = t === a[0];
      if (ok) {
        mana = Math.min(MAX_MANA, mana + 3);
        floatText(myTower.x, myTower.y - 60, "+3 🍞", "#8e44ad", 24, false);
        burst(myTower.x, myTower.y - 40, 20, ["#f1c40f", "#e2b6ff", "#fff"], { speed: 120, life: 0.8 });
      }
      say(ok ? "Brawo! Plus trzy manny!" : "Prawidłowa odpowiedź to: " + a[0]);
      askCd = 15; paused = false; dlg.close();
    };
    dlg.append(b);
  });
  dlg.showModal();
  say(q);
};
dlg.addEventListener("cancel", e => e.preventDefault());

function end(won) {
  over = true;
  if (won) for (let i = 0; i < 160; i++)
    fx.push({ x: Math.random() * W, y: -Math.random() * 200, vx: (Math.random() - 0.5) * 60, vy: 60 + Math.random() * 80, g: 20,
              life: 5, max: 5, size: 6, color: ["#e74c3c", "#f1c40f", "#2ecc71", "#3498db", "#9b59b6"][i % 5] });
  setTimeout(() => {
    dlg.innerHTML = `<p style="font-size:64px;margin:0">${won ? "🏆" : "💪"}</p><p>${won ? "Zwycięstwo! Twierdza Goliata upadła!" : "Tym razem się nie udało. Spróbuj jeszcze raz!"}</p><button onclick="location.reload()">Zagraj jeszcze raz</button>`;
    dlg.showModal();
    say(won ? "Zwycięstwo!" : "Spróbuj jeszcze raz!");
  }, 1200); // najpierw widać wybuch wieży
}

// wybór poziomu na start
dlg.innerHTML = `<p style="font-size:48px;margin:0">⚔️</p><p>Wybierz poziom trudności</p>`;
LEVELS.forEach(l => {
  const b = document.createElement("button");
  b.textContent = l.name;
  b.onclick = () => { level = l; paused = false; dlg.close(); };
  dlg.append(b);
});
dlg.showModal();

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  T += dt; shake = Math.max(0, shake - dt); msgT -= dt;
  if (!paused && !over) step(dt);
  for (const p of fx) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; }
  fx = fx.filter(p => p.life > 0);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
